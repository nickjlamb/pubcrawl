# Built from the Dockerfile, so production runs the image CI builds and smoke-tests
# (Node 22, which the undici 8 override in package.json needs).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
# Always restart: with "on_failure" and a retry cap, the service stayed down once
# the cap was used up (outage of 2026-11-21).
restartPolicyType = "always"
