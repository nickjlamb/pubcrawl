name: opengate

# Grounding / retrieval-fidelity gates.
#
# Job 1 exercises the *built* PubCrawl server through OpenGATE's `retrieval`
# scorer, checking that literature records come back matching hand-verified
# anchors (right title, all authors, intact abstract) with no parse regressions.
#
# Job 2 runs the in-repo fidelity benchmark (benchmark/run.mjs) over the two tool
# families the literature scorer doesn't cover — drug labelling (compare_labels
# anchors + verbatim-against-source check) and clinical trials. Only *verified*
# cases can fail it; see benchmark/README.md.
#
# It runs on release and on demand — deliberately NOT on every push — because the
# retrieval scorer is online: it calls the live NCBI / Europe PMC APIs, which
# would make routine CI flaky (rate limits, upstream downtime). The offline
# `lint -> test -> build` gate in build.yml stays on every push/PR.

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  grounding-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PubCrawl
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build PubCrawl
        run: |
          npm ci
          npm run build

      - name: Check out OpenGATE
        uses: actions/checkout@v4
        with:
          repository: nickjlamb/opengate
          ref: master # OpenGATE's default branch is master, not main
          path: opengate

      - name: Install adapter dependency (MCP SDK)
        working-directory: opengate
        run: npm ci --omit=dev && npm install --no-save @modelcontextprotocol/sdk

      - name: Run OpenGATE retrieval gate against the built server
        working-directory: opengate
        env:
          # Point the pubcrawl adapter at THIS repo's freshly built server over
          # stdio, so the gate tests the code being released — not the published
          # npm package. Anchors are absolute correctness checks, so the gate
          # fails on any parse regression even without a stored baseline; commit
          # results/baseline.pubcrawl.json (from a local `--baseline` run) to also
          # catch metric drift such as latency.
          PUBCRAWL_CMD: node
          PUBCRAWL_ARGS: ${{ github.workspace }}/dist/index.js
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: node src/runner.mjs --online --adapter ./src/adapters/pubcrawl.mjs --ci

  labelling-trials-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build PubCrawl
        run: |
          npm ci
          npm run build

      - name: Run labelling + trials fidelity benchmark (verified cases gate)
        run: node benchmark/run.mjs --ci --save

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-benchmark-results
          path: benchmark/results/latest.json
