<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PubCrawl — PubMed, drug labels, and clinical trials for AI assistants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; }
      .mono { font-family: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-weight: 500; }
      .pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- three linked source nodes (literature · label · trial) -->
  <g stroke="#C4B5FD" stroke-opacity="0.5" stroke-width="2">
    <line x1="1000" y1="96" x2="1080" y2="160"/>
    <line x1="1080" y1="160" x2="1000" y2="224"/>
    <line x1="1000" y1="96" x2="1000" y2="224"/>
  </g>
  <g>
    <circle cx="1000" cy="96"  r="26" fill="#EDE9FE"/>
    <circle cx="1080" cy="160" r="26" fill="#DDD6FE"/>
    <circle cx="1000" cy="224" r="26" fill="#EDE9FE"/>
    <text x="1000" y="103" text-anchor="middle" class="pill" font-size="24" fill="#5B21B6">P</text>
    <text x="1080" y="167" text-anchor="middle" class="pill" font-size="24" fill="#5B21B6">L</text>
    <text x="1000" y="231" text-anchor="middle" class="pill" font-size="24" fill="#5B21B6">T</text>
  </g>

  <!-- wordmark -->
  <text x="80" y="150" class="wm" font-size="96" fill="#FFFFFF" letter-spacing="-2">PubCrawl</text>

  <!-- tagline -->
  <text x="84" y="200" class="tag" font-size="30" fill="#DDD6FE">PubMed · drug labels · clinical trials — for AI assistants</text>

  <!-- install line -->
  <text x="84" y="252" class="mono" font-size="22" fill="#C4B5FD">$ npm install -g @pharmatools/pubcrawl</text>

  <!-- footer -->
  <text x="84" y="292" class="tag" font-size="18" fill="#A78BFA" letter-spacing="0.5">A Model Context Protocol server · built by PharmaTools.AI</text>
</svg>
