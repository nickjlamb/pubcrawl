<text x="421" y="412" font-size="11" text-anchor="middle" fill="#9198a1">XML / JATS / SPL &#183; time-bounded</text>
<polyline points="271,398 250,398 250,182" fill="none" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4"/>
