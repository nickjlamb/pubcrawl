<polyline points="790,376 790,478 56,478 56,260" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="452" y="470" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">every result carries its own identifier &#8212; PMID &#183; NCT &#183; DOI</text>
