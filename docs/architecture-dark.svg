<text x="790" y="230" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">openFDA &#183; DailyMed</text>
<text x="790" y="248" font-size="11" text-anchor="middle" fill="#9198a1">US prescribing info</text>
<rect x="650.0" y="268" width="280" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="790" y="290" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">UK eMC</text>
<text x="790" y="308" font-size="11" text-anchor="middle" fill="#9198a1">SmPC</text>
<rect x="650.0" y="328" width="280" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
