<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="PubCrawl architecture: an MCP client connects over stdio or streamable HTTP to the PubCrawl server, whose 14 tools are grouped into literature, drug labelling and clinical trials. Each family calls the official APIs directly — NCBI E-utilities, Europe PMC, openFDA and DailyMed, the UK eMC, and ClinicalTrials.gov — behind a shared LRU cache, XML/JATS/SPL parsers and rate limits. Every result returns with its own identifier: PMID, NCT or DOI. No model sits in this path; nothing is invented.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d86"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
<rect x="16" y="52" width="170" height="400" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="34" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">MCP CLIENT</text>
<rect x="31.0" y="200" width="140" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="101" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Your assistant</text>
<text x="101" y="240" font-size="11" text-anchor="middle" fill="#9198a1">Claude &#183; Cursor</text>
<text x="116" y="290" font-size="11" font-style="italic" fill="#9198a1" text-anchor="middle">&#8220;Compare US and UK&#8221;</text>
<text x="116" y="306" font-size="11" font-style="italic" fill="#9198a1" text-anchor="middle">&#8220;labelling for this drug&#8221;</text>
<rect x="216" y="52" width="390" height="400" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="234" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">PUBCRAWL MCP SERVER</text>
<rect x="271.0" y="88" width="300" height="44" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="421" y="114.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">stdio &#183; streamable HTTP</text>
