<text x="421" y="196" font-size="11" text-anchor="middle" fill="#9198a1">search &#183; abstract &#183; full text &#183; cite</text>
<rect x="271.0" y="224" width="300" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="421" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Drug labelling &#183; 5 tools</text>
<text x="421" y="264" font-size="11" text-anchor="middle" fill="#9198a1">USPI &#183; SmPC &#183; compare &#183; resolve</text>
